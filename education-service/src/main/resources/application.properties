server.port=${PORT:8083}
# свагер имя сервиса
spring.application.name=education-service
spring.main.banner-mode=off

# база общая
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vuz_ms?currentSchema=education_service}
spring.datasource.username=${DB_USER:${user.name}}
spring.datasource.password=${DB_PASSWORD:}

# таблицы
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# json
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.sort-properties-alphabetically=false

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.publisher-confirm-type=simple

# swagger ui: http://localhost:8083/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
