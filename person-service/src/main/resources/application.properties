server.port=${PORT:8081}
spring.application.name=person-service
spring.main.banner-mode=off

# база общая (vuz_ms), но у каждого сервиса своя схема
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vuz_ms?currentSchema=person_service}
spring.datasource.username=${DB_USER:${user.name}}
spring.datasource.password=${DB_PASSWORD:}

# таблицы создаются через db/init.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# json как в лр1: birth_date вместо birthDate
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.sort-properties-alphabetically=false

spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.publisher-confirm-type=simple

# swagger ui: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
